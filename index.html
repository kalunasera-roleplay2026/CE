<div class="card">
<b>SKILL CARDS - 28 SKILL</b>
<div class="small">Centang skill yang mau aktif</div>
<div id="skillGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:11px;margin-top:8px"></div>
<button class="btn btn-blue" onclick="checkAllSkill()">AKTIFKAN SEMUA SKILL 🔥</button>
</div>

<div class="card">
<b>PLAYER STYLE - COM PLAYING STYLES</b>
<div id="styleGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:11px;margin-top:8px"></div>
<button class="btn btn-blue" onclick="checkAllStyle()">AKTIFKAN SEMUA STYLE 🔥</button>
</div>

<script>
const skills=["Scissors Feint","Double Touch","Flip Flap","Marseille Turn","Sombrero","Crossover Turn","Cut Behind & Turn","Scottish Move","Step On Skill","Heading","Long Range Drive","Knuckle Shot","Acrobatic Finishing","Heel Trick","First-time Shot","One-touch Pass","Weighted Pass","Pinpoint Crossing","Outside Curler","Rabona","No Look Pass","Low Lofted Pass","Low Punt Trajectory","GK Long Throw","Long Throw","Super-Sub","Fighting Spirit","Captaincy"];

const styles=["Trickster","Mazing Run","Speeding Bullet","Incisive Run","Long Ball Expert","Early Cross","Long Ranger","Enforcer","Battle Tank","Fox In The Box","Goal Poacher","Dummy Runner","Free Roaming","Track Back","Anchor Man"];

const sGrid=document.getElementById('skillGrid');
skills.forEach((s,i)=>{sGrid.innerHTML+=`<label style="display:flex;align-items:center;gap:5px"><input type="checkbox" id="skill${i}" style="width:15px"> ${s}</label>`});

const stGrid=document.getElementById('styleGrid');
styles.forEach((s,i)=>{stGrid.innerHTML+=`<label style="display:flex;align-items:center;gap:5px"><input type="checkbox" id="style${i}" style="width:15px"> ${s}</label>`});

function checkAllSkill(){skills.forEach((s,i)=>{document.getElementById('skill'+i).checked=true})}
function checkAllStyle(){styles.forEach((s,i)=>{document.getElementById('style'+i).checked=true})}
</script>
