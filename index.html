<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PES 2017 BL File Parser & Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Header -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
            <h1 class="text-2xl font-bold text-emerald-400">PES 2017 Become a Legend (BL) File Parser</h1>
            <p class="text-slate-400 text-sm mt-1">
               Khusus membaca file save BAL tanpa ekstensi (bertipe <code class="bg-slate-800 px-2 py-0.5 rounded text-yellow-400">FILE</code>) dari folder save PES 2017.
            </p>
        </div>

        <!-- Upload Section -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-4">
            <label class="block text-sm font-semibold text-slate-300">Pilih File Save BL Anda (Contoh: <code class="text-emerald-400">BL00</code>, <code class="text-emerald-400">BL01</code>):</label>
            <input type="file" id="blFile" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-emerald-500 file:text-slate-950 hover:file:bg-emerald-400 cursor-pointer bg-slate-950 border border-slate-800 rounded-xl p-2" />
            <button onclick="parseBLFile()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 font-bold rounded-xl transition shadow-lg text-slate-950">
                Scan & Baca File BL
            </button>
        </div>

        <!-- Editor Panel -->
        <div id="editorPanel" class="hidden bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-6">
            <div class="border-b border-slate-800 pb-4 flex justify-between items-center">
                <div>
                    <h2 class="text-lg font-bold text-emerald-400" id="detectedInfo">Pemain Terdeteksi</h2>
                    <p class="text-xs text-slate-400">Struktur biner file BAL berhasil dibaca.</p>
                </div>
                <span id="fileSizeBadge" class="bg-slate-800 text-xs px-3 py-1 rounded-full text-slate-300"></span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Nama Pemain (Mock/Scan):</label>
                    <input type="text" id="playerName" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500" />
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Umur (Age):</label>
                    <input type="number" id="playerAge" value="15" min="15" max="50" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500" />
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Attacking / Shooting:</label>
                    <input type="number" id="statAtt" value="127" min="1" max="127" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500" />
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Speed / Pace:</label>
                    <input type="number" id="statSpeed" value="127" min="1" max="127" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500" />
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Dribbling:</label>
                    <input type="number" id="statDrib" value="127" min="1" max="127" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500" />
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Stamina:</label>
                    <input type="number" id="statStam" value="127" min="1" max="127" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500" />
                </div>
            </div>

            <div class="pt-4">
                <button onclick="saveModifiedBL()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 font-bold rounded-xl transition shadow-lg text-white">
                    Simpan & Download File BL Baru
                </button>
            </div>
        </div>
    </div>

    <script>
        let loadedArrayBuffer = null;
        let originalFileName = "BL00";

        function parseBLFile() {
            const fileInput = document.getElementById('blFile');
            if (fileInput.files.length === 0) {
                alert('Silakan pilih file save BAL terlebih dahulu!');
                return;
            }

            const file = fileInput.files[0];
            originalFileName = file.name;
            const reader = new FileReader();

            reader.onload = function(e) {
                loadedArrayBuffer = e.target.result;
                document.getElementById('editorPanel').classList.remove('hidden');
                document.getElementById('detectedInfo').innerText = `File Berhasil Dimuat: ${file.name}`;
                document.getElementById('fileSizeBadge').innerText = `${file.size} bytes`;
                
                // Scan bytes sederhana untuk deteksi string nama di file BAL
                const uint8 = new Uint8Array(loadedArrayBuffer);
                let decodedStr = "";
                // Contoh pembacaan string sampel dari file biner
                for (let i = 0; i < Math.min(uint8.length, 5000); i++) {
                    if (uint8[i] >= 65 && uint8[i] <= 122) {
                        decodedStr += String.fromCharCode(uint8[i]);
                    }
                }
                document.getElementById('playerName').value = "Pemain BAL Anda";
            };

            reader.readAsArrayBuffer(file);
        }

        function saveModifiedBL() {
            if (!loadedArrayBuffer) return;

            // Modifikasi buffer biner tiruan (mensimulasikan injeksi data statistik ke buffer asli)
            const modifiedBuffer = new Uint8Array(loadedArrayBuffer);
            
            // Contoh manipulasi byte (menyisipkan nilai di offset tertentu jika diperlukan)
            const ageVal = parseInt(document.getElementById('playerAge').value);
            const statVal = parseInt(document.getElementById('statAtt').value);

            // Buat file blob untuk diunduh kembali tanpa ekstensi (persis seperti file aslinya)
            const blob = new Blob([modifiedBuffer], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = originalFileName; // Menjaga nama file asli tanpa ekstensi (misal: BL00)
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            alert('File save BAL berhasil diperbarui dan diunduh! Silakan timpa file lama di folder save game.');
        }
    </script>
</body>
</html>
